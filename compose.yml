# Mailvec homelab stack — the full mail pipeline in one compose project,
# with Ollama external (a GPU VM reachable over the LAN) and the MCP server
# exposed through a Cloudflare tunnel.
#
#   fastmail ◄─IMAP── mbsync ──► ./mail ──► indexer ─┐
#                                                     ▼
#   cloudflared ──► mcp:3333 ◄────── ./data ◄── embedder ──► ${OLLAMA_BASE_URL}
#
# Setup on the Docker host:
#   1. cp .env.example .env                          # Ollama URL, tunnel token
#   2. cp ops/mbsyncrc.container.example mbsyncrc    # fill in User / Patterns
#   3. mkdir -p secrets
#      printf '%s' '<fastmail app password>' > secrets/fastmail_password
#   4. Seed ./data/archive.sqlite from an ops/export-db.sh snapshot — see
#      "Migrating the archive from the Mac" in docs/deploy-docker.md
#      (or set MAILVEC_REQUIRE_SEEDED_DB=0 in .env for a from-scratch build).
#   5. docker compose --profile tunnel up -d --build
#      (--profile tunnel starts cloudflared, the only ingress to mcp; a plain
#      `up -d` runs the pipeline but leaves it unreachable. Omit it only for
#      a deliberately local/LAN-only bring-up.)
#
# ./data and ./mail must live on host-local disk: SQLite WAL needs real POSIX
# file locking, so never place them on an NFS/SMB mount. The maildir is
# mounted read-only into every service except mbsync (the pipeline is
# pull-only end to end).
#
# Operator commands: docker compose exec mcp mailvec status|doctor|eval ...

name: mailvec

x-mailvec: &mailvec-common
  # Two deploy modes (docs/deploy-docker.md "Prebuilt images"):
  #   build on host (default): docker compose up -d --build   -> mailvec:local
  #   pull from GHCR:          set MAILVEC_IMAGE in .env, then
  #                            docker compose pull && docker compose up -d
  # With both image: and build: present, a bare `up` BUILDS when the tag
  # isn't already local — the pull path must run `compose pull` first. And
  # don't run `--build` while MAILVEC_IMAGE points at the GHCR ref: that
  # retags the remote name with a local build.
  image: ${MAILVEC_IMAGE:-mailvec:local}
  build:
    context: .
    target: runtime
  restart: unless-stopped
  # Container hardening shared by the three .NET services. These bound what a
  # compromised parser gets, which matters here because the parsers eat
  # attacker-chosen bytes: anyone can mail an attachment, and the embedder's OCR
  # pass feeds it to PDFium/SkiaSharp unattended. See docs/security.md
  # "Container hardening".
  #
  # cap_drop ALL removes DAC_OVERRIDE and FOWNER along with everything else, so
  # container-root no longer bypasses file permission bits. Steady state is fine
  # (everything under ./data and ./mail is created by these containers, so root
  # owns it), but a SEEDED archive.sqlite copied in by a non-root host user
  # becomes unreadable — chown it to 0:0. See the seeding steps in
  # docs/deploy-docker.md.
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  # The cgroup pids controller counts TASKS, so every .NET thread counts, not
  # just processes — 512 is far above the ~20-40 these run at (plus whatever a
  # `docker compose exec mcp mailvec ...` operator command adds) while still
  # bounding a fork bomb long before the VM's own pid space is at risk.
  pids_limit: 512
  environment: &mailvec-env
    Ingest__MaildirRoot: /mail/Fastmail
    Ollama__BaseUrl: ${OLLAMA_BASE_URL:-http://localhost:11434}
    # Refuse to start against a missing/empty archive (the expected state for
    # a snapshot-seeded deployment — see the entrypoint guard in Dockerfile).
    MAILVEC_REQUIRE_SEEDED_DB: ${MAILVEC_REQUIRE_SEEDED_DB:-1}

services:
  mcp:
    <<: *mailvec-common
    environment:
      <<: *mailvec-env
      Fastmail__AccountId: ${FASTMAIL_ACCOUNT_ID:-}
      # The DNS-rebinding HostGuard (src/Mailvec.Mcp/HostGuard.cs) 403s any
      # request whose Host header isn't loopback or allowlisted. Requests
      # arriving through cloudflared carry the public tunnel hostname, so it
      # must be allowed; "mcp" covers direct in-network access from other
      # containers. Empty entries are filtered by the guard, so an unset
      # MCP_PUBLIC_HOSTNAME is harmless.
      Mcp__AllowedHosts__0: ${MCP_PUBLIC_HOSTNAME:-}
      Mcp__AllowedHosts__1: mcp
      Mcp__AllowedHosts__2: ${MCP_LAN_HOSTNAME:-}
      # Origin validation of the Cloudflare Access assertion — the second layer
      # under the tunnel. Unset (the default) leaves the origin trusting anything
      # that can reach mcp:3333, exactly as this stack has always run, with a
      # warning logged at boot. Set the three MCP_ACCESS_* values in .env to turn
      # it on; the server refuses to start on a half configuration rather than
      # looking protected while admitting every app in the account.
      #
      # Note this is what makes the /up split enforceable HERE rather than only
      # in Cloudflare's control plane: a token minted for the path-scoped
      # monitoring app fails the audience check on / and /health even if the
      # Access policy is wrong. See docs/security.md and
      # docs/remote-access-cloudflare.md "Origin validation".
      Mcp__Access__Enabled: ${MCP_ACCESS_ENABLED:-false}
      Mcp__Access__TeamDomain: ${MCP_ACCESS_TEAM_DOMAIN:-}
      Mcp__Access__Audience: ${MCP_ACCESS_AUDIENCE:-}
      Mcp__Access__MonitoringAudience: ${MCP_ACCESS_MONITORING_AUDIENCE:-}
      # The compose healthcheck below curls 127.0.0.1:3333/health from inside
      # this container and has no assertion to present, as does `mailvec doctor`
      # under `docker compose exec`. Leave the loopback exemption on or the
      # container marks itself permanently unhealthy the moment validation is
      # enabled. cloudflared and every sibling arrive over the compose network
      # with a real address, so they are never exempt.
      Mcp__Access__AllowLoopback: ${MCP_ACCESS_ALLOW_LOOPBACK:-true}
      # /health is loopback-only (404 to anything else). It discloses the
      # archive path, corpus counts, the embedding model identity and the
      # internal Ollama LAN address; /up exists so nothing external needs any of
      # that. The in-container consumers are all loopback and unaffected: the
      # healthcheck below, `mailvec doctor` under `docker compose exec`, the
      # tray on local installs.
      #
      # ⚠️ CHECK THE MONITORS BEFORE DEPLOYING THIS. An off-box Uptime Kuma
      # monitor pointed at /health goes hard-down the moment this takes effect,
      # and a blind monitor looks exactly like a healthy one until you need it.
      # As of 2026-08-03 all six monitors were still on /health with the
      # migration pending — verify where they actually point (don't trust this
      # comment, it dates), migrate them to /up first, and only then deploy.
      # Escape hatch if you're mid-migration: MCP_RESTRICT_HEALTH_TO_LOOPBACK=false
      # in .env keeps /health answering off-box until the repoint is done.
      # Procedure: docs/monitoring-uptime-kuma.md "Migrating existing monitors".
      #
      # Stated explicitly rather than left to the code default for the same
      # reason as Mcp__EnableTrayEndpoints above: an operator reading compose.yml
      # should be able to see the deployment's posture without going and reading
      # McpOptions. Set false only if something genuinely off-box needs the
      # detailed body — and prefer pointing it at /up instead.
      Mcp__RestrictHealthToLoopback: ${MCP_RESTRICT_HEALTH_TO_LOOPBACK:-true}
      # The mail-bearing /tray/* surface, off. Three independent things now say
      # so, and each covers a gap the others don't:
      #   1. this line — the deployment's own stated posture, visible to anyone
      #      reading compose.yml without having to go and read the Dockerfile;
      #   2. the IMAGE default (Mcp__EnableTrayEndpoints=false, baked into the
      #      Dockerfile), which still holds for a compose file that forgets;
      #   3. TrayExposureGuard, which refuses to start the server at all when
      #      the tray is enabled on a non-loopback bind — and this container
      #      binds 0.0.0.0. Flipping this to "true" is a crash loop naming the
      #      knob, not an unauthenticated mailbox.
      # Redundant on purpose: /tray/* returns full message bodies, the folder
      # map, full-text search and the IMAP account, with no auth of its own.
      # See docs/security.md "/up, /health and /tray/*".
      Mcp__EnableTrayEndpoints: "false"
      #
      # Drops the two tools that feed mail bytes to native parsers
      # (PDFium/SkiaSharp) on demand. It's the native parsing that's the risk,
      # not the payload: get_attachment_page_image returns one rendered JPEG
      # page, and view_attachment returns an inline image or small decoded text
      # — neither ships whole raw documents back through MCP.
      #
      # Left OFF as a deliberate accepted risk: the embedder's OCR pass already
      # feeds those same parsers unattended for every scanned attachment that
      # arrives by mail, and every caller the Access gate admits is already
      # owner-equivalent — so the trim would close the smaller, attended half of
      # an exposure that stays open either way.
      #
      # REINSTATE (uncomment) if any of that stops holding: a host port gets
      # published below, a caller that ISN'T owner-equivalent clears Access
      # (note the root policy is `Any Access Service Token`, so a token created
      # anywhere in the account qualifies, with no edit here), the tunnel stops
      # 404-ing /tray/*, or a mutating tool lands. Full rationale + conditions:
      # docs/security.md "What's accepted".
      #
      # An unknown name here fails startup on purpose (a typo would silently
      # leave the tool exposed).
      # Mcp__DisabledTools__0: view_attachment
      # Mcp__DisabledTools__1: get_attachment_page_image
    volumes:
      - ./data:/data
      - ./mail:/mail:ro
      - ./logs/mcp:/logs
    # A ceiling, not a reservation — nothing is set aside, so a limit above what
    # the VM has costs nothing until it's actually hit.
    #
    # Deliberately roomy, and NOT to be tuned down casually: a cgroup memory
    # limit charges PAGE CACHE to the container, and mcp's search latency rides
    # on ~1.2 GB of chunk vectors living in the OS file cache. Process RSS is
    # only ~22 MB — the vectors are not in the .NET heap. Set this near the
    # working set and the kernel reclaims those pages rather than OOM-killing,
    # so nothing crashes and nothing logs; search just degrades from ~0.3 s warm
    # to ~2-3 s cold and stays there. See docs/contributing/search-performance.md.
    mem_limit: 3g
    healthcheck:
      # /health returns 503 when degraded, which includes "Ollama unreachable"
      # — so an Ollama VM outage shows here as an unhealthy mcp container even
      # though keyword search still works. Informative, not fatal: nothing
      # restarts or gates on it.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # No host port: the Cloudflare tunnel is the only ingress, and the
    # security model's accepted risks depend on that. Publishing this exposes
    # port 3333 to the whole LAN with NO auth — HostGuard is not an auth
    # boundary, it only checks a spoofable Host header — bypassing the Access
    # OAuth front entirely. If you do publish it (LAN-only testing), set
    # MCP_LAN_HOSTNAME in .env or HostGuard 403s it, AND uncomment the
    # Mcp__DisabledTools__* lines above. See docs/security.md.
    # ports:
    #   - "3333:3333"

  indexer:
    <<: *mailvec-common
    command: ["dotnet", "/app/indexer/Mailvec.Indexer.dll"]
    volumes:
      - ./data:/data
      - ./mail:/mail:ro
      - ./logs/indexer:/logs
    # PdfPig and OpenXML DOM-load whole documents, and Indexer:AttachmentMaxBytes
    # (25 MB) bounds the *input*, not how far the parse expands it.
    mem_limit: 2g

  embedder:
    <<: *mailvec-common
    command: ["dotnet", "/app/embedder/Mailvec.Embedder.dll"]
    volumes:
      - ./data:/data
      - ./mail:/mail:ro    # OCR pass reads .eml bytes out of the maildir
      - ./logs/embedder:/logs
    # The two halves of the decode-bomb defense: ImageRenderer.MaxDecodedPixels
    # caps a SINGLE decode at ~160 MB of raster, this caps the process around it
    # so a leak or a pathological batch can't walk past that either.
    mem_limit: 2g

  mbsync:
    image: ${MAILVEC_MBSYNC_IMAGE:-mailvec-mbsync:local}
    build:
      context: .
      target: mbsync
    restart: unless-stopped
    # Same hardening as the .NET services. mbsync is the one service holding a
    # live credential (the Fastmail app password) and the only one with a
    # WRITABLE Maildir mount, so a compromise here is worth bounding even though
    # it parses nothing untrusted itself. Needs no capabilities: it makes
    # outbound TLS connections and writes files it owns.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    # The sh loop, one mbsync child, one sleep — single digits in practice.
    pids_limit: 128
    environment:
      MBSYNC_INTERVAL_SECONDS: ${MBSYNC_INTERVAL_SECONDS:-600}
      # Liveness beat (read by mcp's /health via MbsyncHeartbeatFile) lands at
      # dirname(MBSYNC_MAILDIR)/.mailvec-mbsync-heartbeat. MBSYNC_MAILDIR
      # defaults to /mail/Fastmail (Dockerfile), so the beat is /mail/... and
      # mcp derives the same path from dirname(Ingest__MaildirRoot=/mail/Fastmail).
      # If you ever override MBSYNC_MAILDIR here, keep its PARENT equal to the
      # parent of the mcp/indexer Ingest__MaildirRoot, or mbsync silently reads
      # as "unknown" on /health forever (a path mismatch, not a real outage).
    volumes:
      - ./mail:/mail
      - ./mbsyncrc:/root/.mbsyncrc:ro
      # No ./logs mount here on purpose: MAILVEC_LOG_DIR and Serilog exist
      # only in the runtime stage. This image is Alpine + the mbsync-loop sh
      # script, whose output is stderr (docker logs) and the heartbeat file
      # under /mail. A logs mount would stay empty and mislead anyone
      # debugging a sync failure.
    secrets:
      - fastmail_password

  cloudflared:
    # LIVE in the homelab: this is the only ingress to mcp, fronted by a
    # Cloudflare Access self-hosted app (Managed OAuth). Bring the stack up
    # with `docker compose --profile tunnel up -d` — a plain `up -d` SKIPS
    # this service and silently leaves the deployment unreachable.
    # Requires TUNNEL_TOKEN and MCP_PUBLIC_HOSTNAME in .env.
    # See docs/remote-access-cloudflare.md.
    profiles: ["tunnel"]
    # Pinned by DIGEST, not by tag. This container holds the tunnel credential
    # and is the only thing that can reach the unauthenticated mcp origin, so
    # "whatever :latest resolves to today" is the one image in this stack where
    # an unreviewed change matters most — and a moving tag means every `compose
    # pull` can silently swap it. The version tag is here for humans; the digest
    # is what Docker actually resolves.
    #
    # Digest bumps arrive as Dependabot PRs (see .github/dependabot.yml) so the
    # pin gets refreshed on a schedule rather than rotting into a stale build
    # with known CVEs — which is the failure mode digest pinning invites if
    # nothing is bumping it. To bump by hand, resolve the digest and confirm it
    # matches the version tag you intend:
    #   docker buildx imagetools inspect cloudflare/cloudflared:<version>
    image: cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    restart: unless-stopped
    # This container holds the tunnel credential and can reach the
    # unauthenticated mcp origin, which makes it the highest-value target in the
    # stack despite doing the least. It mounts no mailbox data (keep it that
    # way) and needs no capabilities: the tunnel is an OUTBOUND connection and
    # it binds no privileged port. Verified to start unimpaired under cap_drop.
    # Expect one startup warning: cloudflared's ICMP proxy wants CAP_NET_RAW (or
    # a ping socket) and disables itself without it. Unused here — this tunnel
    # forwards HTTP to mcp:3333, nothing else — but it's the one line in the
    # cloudflared log that will look new after this change.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    # Go multiplexes goroutines onto few OS threads; the task count sits well
    # under 50 even with the tunnel's connection pool busy.
    pids_limit: 256
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
      # Edge transport. cloudflared's default is `auto`: try QUIC (UDP), fall
      # back to http2 if UDP connections can't be established. Parameterised
      # rather than pinned because forcing a value is a PER-NETWORK workaround,
      # not a recommendation — hardcoding http2 here would quietly downgrade
      # every other deployment to route around one ISP. Values: auto | http2 |
      # quic.
      #
      # Set TUNNEL_TRANSPORT_PROTOCOL=http2 in .env on a UDP-hostile path. The
      # symptom is repeated "connIndex 3" reconnect flapping in the cloudflared
      # log. Note `auto` does NOT rescue that case: its fallback is a
      # connect-time decision, so a path where UDP connects cleanly and then
      # MTU-breaks or gets throttled mid-session never triggers it — QUIC comes
      # up, degrades, reconnects, forever. Only forcing http2 fixes it.
      # cloudflared names the protocol it selected at startup; that's the
      # confirmation the override took.
      TUNNEL_TRANSPORT_PROTOCOL: ${TUNNEL_TRANSPORT_PROTOCOL:-auto}
    depends_on:
      - mcp

secrets:
  fastmail_password:
    file: ./secrets/fastmail_password
