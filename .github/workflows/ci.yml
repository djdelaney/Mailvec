# CI for Mailvec. Two independent jobs:
#
#   dotnet — fetch vec0.dylib, build all projects (TreatWarningsAsErrors is on,
#            so a warning fails here), run the full xUnit suite. No Ollama is
#            required: every test that touches the embedding/vision clients
#            uses stub HTTP handlers, and ProgramHttpTests deliberately points
#            Ollama:BaseUrl at a dead port to cover the unreachable path
#            deterministically. The suite DOES exercise real native deps
#            (sqlite-vec, PDFium/SkiaSharp page rendering), so this covers the
#            macOS RID specifically — macos-latest is Apple Silicon, and
#            fetch-sqlite-vec.sh refuses Intel Macs.
#
#            This job used to be described as macOS-ONLY-capable, on the
#            grounds that the fetch script "refuses x86_64". It refuses
#            Darwin-x86_64 (Intel Macs); Linux-x86_64 has always been
#            supported. That misreading is why the Linux job below took so
#            long to exist.
#
#   dotnet-linux — the same suite on the deploy platform. See the comment on
#            the job for why a macOS-only suite could not catch a per-RID
#            native break, and did not for three days.
#
# The version-lockstep check mirrors the guard in ops/release.sh (and
# ops/build-mcpb.sh's plain build) so drift between Directory.Build.props and
# manifest.json fails a PR, not the next release build.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PR branches — only the tip matters there, and a
  # push during a run means the earlier commit is already history.
  #
  # NOT on main, where cancelling loses information that nothing recreates.
  # Two pushes close together used to cancel the first commit's run, leaving it
  # on main with no verdict of its own; the next commit's green run covers the
  # tree, not that commit, so a bisect lands on a revision CI never judged.
  # Worse, publish-images is gated on CI *success* via workflow_run, so a
  # cancelled run publishes nothing — the commit gets no image, and the skipped
  # publish looks identical to one declined for a red suite. Both happened
  # repeatedly on 2026-08-04 and cost a false "CI failed" diagnosis.
  #
  # Main is low-volume and the runs are minutes, so serialising them is cheap.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dotnet:
    name: Build + .NET tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Verify version lockstep (props / manifest)
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          manifest = json.load(open("manifest.json"))["version"]
          props = re.search(r"<Version>(\d+\.\d+\.\d+)</Version>", pathlib.Path("Directory.Build.props").read_text()).group(1)
          if manifest != props:
              print(f"Version drift: manifest.json={manifest} Directory.Build.props={props}. "
                    "Use ops/release.sh to keep them in lockstep.", file=sys.stderr)
              sys.exit(1)
          print(f"Version lockstep OK: {manifest}")
          PY

      - name: Fetch sqlite-vec extension
        run: ./ops/fetch-sqlite-vec.sh

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "console;verbosity=normal"

      # Dependabot opens PRs weekly; this catches the window in between — an
      # advisory published against a version already pinned here produces no PR
      # until the next run, and nothing else in CI would notice. Transitive
      # included because that's where they actually land (nothing references
      # Microsoft.IdentityModel.* directly; it arrives under JwtBearer).
      #
      # `--vulnerable` exits 0 even when it finds something, so the grep is what
      # makes this a gate rather than a log line. Runs after the tests so a
      # security advisory doesn't mask a real test failure.
      - name: Audit NuGet dependencies for known vulnerabilities
        run: |
          set -o pipefail
          dotnet list Mailvec.slnx package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -qE '^\s*>' audit.txt; then
            echo "::error::Vulnerable NuGet package(s) found — see the table above."
            echo "Bump the offending package in Directory.Packages.props. If it is a transitive"
            echo "with no fixed version yet, add an explicit PackageVersion pin to a patched"
            echo "release, or record a reviewed exception here with an expiry."
            exit 1
          fi
          echo "No known vulnerable packages."


  # The deploy target is Linux, and until this job existed nothing exercised it.
  # That is not theoretical: managed SkiaSharp was bumped to 4.151.0 on
  # 2026-08-01 while the Linux native package stayed at 4.150.1 (it arrives via
  # PDFtoImage, not as SkiaSharp's own dependency the way the macOS and Win32
  # ones do). Every PDF render and the whole OCR pass threw on Linux for three
  # days, in published images, while this workflow stayed green — because macOS
  # resolves a matching native. A macOS-only suite is structurally incapable of
  # catching a per-RID resolution break.
  #
  # Cheap to add: Linux runners bill at 1x against macOS's 10x, and this job is
  # the faster of the two. It does NOT replace the macOS job — macOS is a
  # supported install target (launchd agents, the MCPB bundle) and the
  # development platform, so dropping it would just relocate the blind spot.
  #
  # Note this still isn't the container: it tests against the SDK image's
  # runtime, not the Dockerfile's layout. A break in how the image copies
  # natives would need an image smoke test, which is separate work.
  dotnet-linux:
    name: Build + .NET tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Installs runtimes/linux-x64/native/vec0.so. ConnectionFactory resolves
      # it for the current RID when the configured (macOS-shaped) default path
      # finds nothing — no per-job env var needed.
      - name: Fetch sqlite-vec extension
        run: ./ops/fetch-sqlite-vec.sh

      - name: Build
        run: dotnet build --configuration Release

      # Full suite, unfiltered and with nothing skipped for the platform, and
      # it passes as-is. The one test that ever needed macOS was fixed in the
      # code rather than papered over with a skip — that's the precedent. If a
      # test ever genuinely cannot run here, gate that test; do not narrow this
      # filter.
      - name: Test
        run: dotnet test --configuration Release --no-build --logger "console;verbosity=normal"

