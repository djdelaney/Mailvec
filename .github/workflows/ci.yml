# CI for Mailvec. Three independent jobs:
#
#   dotnet — fetch vec0.dylib, build all projects (TreatWarningsAsErrors is on,
#            so a warning fails here), run the full xUnit suite. No Ollama is
#            required: every test that touches the embedding/vision clients
#            uses stub HTTP handlers, and ProgramHttpTests deliberately points
#            Ollama:BaseUrl at a dead port to cover the unreachable path
#            deterministically. The suite DOES exercise real native deps
#            (sqlite-vec, PDFium/SkiaSharp page rendering), so this covers the
#            macOS RID specifically — macos-latest is Apple Silicon, and
#            fetch-sqlite-vec.sh refuses Intel Macs.
#
#            This job used to be described as macOS-ONLY-capable, on the
#            grounds that the fetch script "refuses x86_64". It refuses
#            Darwin-x86_64 (Intel Macs); Linux-x86_64 has always been
#            supported. That misreading is why the Linux job below took so
#            long to exist.
#
#   dotnet-linux — the same suite on the deploy platform. See the comment on
#            the job for why a macOS-only suite could not catch a per-RID
#            native break, and did not for three days.
#
#   image  — on pull requests, builds both Docker images on a native amd64
#            and a native arm64 runner and runs ops/image-smoke.sh against
#            each: the only job that exercises what the Dockerfile actually
#            ships. Pushes to main get the same check in publish-images.yml.
#
# The version-lockstep check mirrors the guard in ops/release.sh (and
# ops/build-mcpb.sh's plain build) so drift between Directory.Build.props and
# manifest.json fails a PR, not the next release build.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Declared rather than inherited from the repo default, matching the other two
# workflows. This job needs nothing but the checkout, and fork PRs already get
# a read-only token — so this changes little today. It exists so the absence of
# a block here can't read as "someone decided the default was needed".
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PR branches — only the tip matters there, and a
  # push during a run means the earlier commit is already history.
  #
  # NOT on main, where cancelling loses information that nothing recreates.
  # Two pushes close together used to cancel the first commit's run, leaving it
  # on main with no verdict of its own; the next commit's green run covers the
  # tree, not that commit, so a bisect lands on a revision CI never judged.
  # Worse, publish-images is gated on CI *success* via workflow_run, so a
  # cancelled run publishes nothing — the commit gets no image, and the skipped
  # publish looks identical to one declined for a red suite. Both happened
  # repeatedly on 2026-08-04 and cost a false "CI failed" diagnosis.
  #
  # Main is low-volume and the runs are minutes, so serialising them is cheap.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dotnet:
    name: Build + .NET tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Verify version lockstep (props / manifest)
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          manifest = json.load(open("manifest.json"))["version"]
          props = re.search(r"<Version>(\d+\.\d+\.\d+)</Version>", pathlib.Path("Directory.Build.props").read_text()).group(1)
          if manifest != props:
              print(f"Version drift: manifest.json={manifest} Directory.Build.props={props}. "
                    "Use ops/release.sh to keep them in lockstep.", file=sys.stderr)
              sys.exit(1)
          print(f"Version lockstep OK: {manifest}")
          PY

      # CLAUDE.md and AGENTS.md duplicate their must-not-miss blocks verbatim
      # rather than one pointing at the other: an agent that skips a file also
      # skips a redirect, which is how the eval corpus got destroyed twice.
      # Duplication is the right call, so the drift it invites gets a machine
      # watching it — same reasoning as the version lockstep check above. A
      # symlink was considered and rejected: git materialises one as a plain
      # file containing the target path on any checkout without symlink
      # support, which reads as a corrupt file.
      - name: Verify the shared CLAUDE.md / AGENTS.md blocks are identical
        run: |
          python3 - <<'PY'
          import pathlib, sys
          BLOCKS = ["frozen-corpus", "public-repo", "release-approval"]
          FILES = ["AGENTS.md", "CLAUDE.md"]
          text = {f: pathlib.Path(f).read_text() for f in FILES}
          failed = False
          for name in BLOCKS:
              b, e = f"<!-- BEGIN {name} -->", f"<!-- END {name} -->"
              chunks = {}
              for f in FILES:
                  if b not in text[f] or e not in text[f]:
                      print(f"{f}: missing {b} / {e} markers.", file=sys.stderr)
                      failed = True
                      break
                  chunks[f] = text[f][text[f].index(b) + len(b):text[f].index(e)]
              else:
                  if len(set(chunks.values())) != 1:
                      print(f"The '{name}' block has drifted between {' and '.join(FILES)}.\n"
                            "Both copies must be byte-identical — edit one and paste it into the other.",
                            file=sys.stderr)
                      failed = True
                  else:
                      print(f"'{name}' in sync ({len(next(iter(chunks.values())))} chars)")
          sys.exit(1 if failed else 0)
          PY

      - name: Fetch sqlite-vec extension
        run: ./ops/fetch-sqlite-vec.sh

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "console;verbosity=normal"

      # Dependabot opens PRs weekly; this catches the window in between — an
      # advisory published against a version already pinned here produces no PR
      # until the next run, and nothing else in CI would notice. Transitive
      # included because that's where they actually land (nothing references
      # Microsoft.IdentityModel.* directly; it arrives under JwtBearer).
      #
      # `--vulnerable` exits 0 even when it finds something, so the grep is what
      # makes this a gate rather than a log line. Runs after the tests so a
      # security advisory doesn't mask a real test failure.
      - name: Audit NuGet dependencies for known vulnerabilities
        run: |
          set -o pipefail
          dotnet list Mailvec.slnx package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -qE '^\s*>' audit.txt; then
            echo "::error::Vulnerable NuGet package(s) found — see the table above."
            echo "Bump the offending package in Directory.Packages.props. If it is a transitive"
            echo "with no fixed version yet, add an explicit PackageVersion pin to a patched"
            echo "release, or record a reviewed exception here with an expiry."
            exit 1
          fi
          echo "No known vulnerable packages."


  # The deploy target is Linux, and until this job existed nothing exercised it.
  # That is not theoretical: managed SkiaSharp was bumped to 4.151.0 on
  # 2026-08-01 while the Linux native package stayed at 4.150.1 (it arrives via
  # PDFtoImage, not as SkiaSharp's own dependency the way the macOS and Win32
  # ones do). Every PDF render and the whole OCR pass threw on Linux for three
  # days, in published images, while this workflow stayed green — because macOS
  # resolves a matching native. A macOS-only suite is structurally incapable of
  # catching a per-RID resolution break.
  #
  # Cheap to add: Linux runners bill at 1x against macOS's 10x, and this job is
  # the faster of the two. It does NOT replace the macOS job — macOS is a
  # development platform (and the deprecated launchd install still builds
  # there), so dropping it would just relocate the blind spot.
  #
  # Note this still isn't the container: it tests against the SDK image's
  # runtime, not the Dockerfile's layout. A break in how the image copies
  # natives is the `image` job's to catch.
  dotnet-linux:
    name: Build + .NET tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Installs runtimes/linux-x64/native/vec0.so. ConnectionFactory resolves
      # it for the current RID when the configured (macOS-shaped) default path
      # finds nothing — no per-job env var needed.
      - name: Fetch sqlite-vec extension
        run: ./ops/fetch-sqlite-vec.sh

      # The Claude cloud-session scripts (docs/contributing/cloud-development.md)
      # are run by nothing else in this repo: the setup script is a paste in
      # claude.ai settings, and the hook fires only when CLAUDE_CODE_REMOTE is
      # "true". Run the hook here, after the fetch it would otherwise perform:
      # it must recognise that install as current. If fetch-sqlite-vec.sh's
      # VERSION line changes shape, the hook's parse comes back empty, it
      # quietly re-downloads on every session, and this step is what notices.
      - name: Claude cloud-session scripts parse, and the hook sees the install
        run: |
          bash -n ops/claude-cloud-setup.sh
          bash -n ops/claude-session-start.sh
          jq -e '.hooks.SessionStart[0].hooks[0].command | contains("ops/claude-session-start.sh")' .claude/settings.json
          out=$(CLAUDE_CODE_REMOTE=true bash ops/claude-session-start.sh)
          echo "$out"
          grep -q 'sqlite-vec already installed' <<<"$out"

      - name: Build
        run: dotnet build --configuration Release

      # Full suite, unfiltered and with nothing skipped for the platform, and
      # it passes as-is. The one test that ever needed macOS was fixed in the
      # code rather than papered over with a skip — that's the precedent. If a
      # test ever genuinely cannot run here, gate that test; do not narrow this
      # filter.
      - name: Test
        run: dotnet test --configuration Release --no-build --logger "console;verbosity=normal"

      # The mbsync sidecar's sync loop and its optional IMAP IDLE support
      # (goimapnotify config generation, wake path, supervisor backoff). The
      # loop is a heredoc inside the Dockerfile, and images are only built
      # after main goes green, so without this nothing runs it before merge.
      # The tests extract the heredoc and run it under /bin/sh (dash here;
      # busybox ash in the image, both POSIX Almquist shells) with stand-in
      # binaries. Python stdlib only, no setup step needed.
      - name: mbsync sidecar tests (sync loop + IDLE)
        run: python3 -m unittest discover -s ops/tests -v

  # The images, per architecture. Every deployment is Docker: linux/amd64 on
  # an x86 Linux host, linux/arm64 under Docker on an Apple Silicon Mac. The
  # two suites above run the code on macOS arm64 and Linux x64, but neither
  # runs the IMAGE — what the Dockerfile fetched for its TARGETARCH, copied
  # and stripped — and nothing at all ran linux/arm64 before it shipped.
  # ops/image-smoke.sh starts each binary the way compose does and checks the
  # natives load (sqlite-vec, PDFium, SkiaSharp, mbsync, goimapnotify).
  #
  # Native runners, never QEMU: emulated `dotnet publish` is slow and
  # unsupported. ubuntu-24.04-arm is free for public repositories.
  # publish-images.yml runs the same script against the bytes it pushes;
  # this job is what makes a failure show up on the PR instead of after merge.
  #
  # Reads the publish workflow's build cache (same scopes) but never writes
  # it, so a PR cannot seed the cache main's published images build from.
  #
  # Pull requests only. On a push to main, publish-images.yml builds the same
  # commit for both architectures and runs the same script against the bytes
  # it pushed, before tagging anything; building here as well would double
  # the work and lengthen the wait `promote` has to sit out.
  image:
    name: Image smoke (linux/${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      # Report both architectures: one failing says nothing about the other.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          # Same digest-pinned builder as publish-images.yml.
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Build app image (linux/${{ matrix.arch }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: mailvec:smoke
          cache-from: type=gha,scope=app-${{ matrix.arch }}

      - name: Build mbsync image (linux/${{ matrix.arch }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: mbsync
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: mailvec-mbsync:smoke
          cache-from: type=gha,scope=mbsync-${{ matrix.arch }}

      - name: Smoke-test the images
        env:
          MAILVEC_SMOKE_EXPECT_ARCH: ${{ matrix.arch }}
        run: ops/image-smoke.sh mailvec:smoke mailvec-mbsync:smoke
