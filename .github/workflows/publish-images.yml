# Build the two deploy images (app + mbsync sidecar) in CI and push to GHCR,
# so the homelab VM can `docker compose pull` instead of building on-host
# (docs/deploy-docker.md "Prebuilt images"). linux/amd64 only — the deploy VM
# is x86 and the natives (vec0.so, PDFium/SkiaSharp) are fetched by TARGETARCH
# inside the build, so a CI build is equivalent to an on-host one.
#
# Publishing is GATED ON CI SUCCESS: the workflow_run trigger fires only when
# the CI workflow completes, and the job checks its conclusion — otherwise
# :latest would advance on every main push even with a red test suite (the
# two workflows are independent). Tag pushes (v*) publish directly: releases
# are cut from commits that already passed on main. A v* publish does verify
# the tag equals Directory.Build.props <Version> at the tagged commit — a
# mismatched tag would label images that report a different version from
# `mailvec status` / the MCP handshake forever (bump via ops/release.sh).
#
# Deploys must pin sha-<gitsha> or v<version>, never chase :latest — the app
# runs SchemaMigrator against the seeded archive on every start, so image
# updates are manual and backup-first (see the no-auto-update note in
# docs/deploy-docker.md). GHCR version pruning lives in cleanup.yml.

name: Publish images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    # For workflow_run events, publish only when CI passed. Tag pushes and
    # manual dispatches have no workflow_run payload and publish directly.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: app
            image: ghcr.io/${{ github.repository_owner }}/mailvec
            target: runtime   # explicit: never depend on "last stage wins"
          - name: mbsync
            image: ghcr.io/${{ github.repository_owner }}/mailvec-mbsync
            target: mbsync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Under workflow_run, github.sha is the default-branch head at
          # trigger time, which may have advanced past the commit CI actually
          # tested — build exactly what passed.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Verify release tag matches <Version>
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's|.*<Version>([0-9]+\.[0-9]+\.[0-9]+)</Version>.*|\1|p' Directory.Build.props)"
          if [[ "v${VERSION}" != "${GITHUB_REF_NAME}" ]]; then
            echo "ERROR: tag ${GITHUB_REF_NAME} does not match Directory.Build.props <Version>=${VERSION}." >&2
            echo "       Bump with ops/release.sh and tag the bump commit — the image label must" >&2
            echo "       equal what its binaries report from 'mailvec status'." >&2
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches <Version>=${VERSION}"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          TAGS="${{ matrix.image }}:sha-${SHORT_SHA}"
          if [[ "${{ github.event_name }}" == "workflow_run" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAGS="$TAGS,${{ matrix.image }}:latest"
          fi
          # Read the ref from the environment, never through an Actions
          # expression: expressions are pasted into the script as text before
          # bash parses it, and git ref names permit " ; | and command
          # substitution (check-ref-format bans only control chars, space and
          # ~^:?*[\). A crafted tag would therefore execute right here, in a job
          # holding packages: write and a live GHCR login — the exact privilege
          # the tag/<Version> gate above exists to police. Same reason
          # GITHUB_REF_NAME is used for the tag value below. The two expressions
          # left in this block, matrix.image and github.event_name, are
          # workflow-controlled literals and can't carry attacker input.
          # :- because set -u is on and the ref is absent for some event types.
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAGS="$TAGS,${{ matrix.image }}:${GITHUB_REF_NAME}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Publishing: $TAGS"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Build provenance (SLSA) + an SBOM, attached to the image as OCI
          # attestations. Two lines, so worth taking even though nothing
          # currently consumes them: what they buy is the ability to answer
          # "which commit produced the digest running in the homelab?" from the
          # registry rather than from memory, and to check a future advisory
          # against what's actually in a deployed image without rebuilding it.
          # Inspect with: docker buildx imagetools inspect <ref> --format '{{json .Provenance}}'
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.revision }}
          # Scoped per image so app/mbsync don't evict each other. NOTE:
          # cleanup.yml's cache prune is scoped to nuget-* keys precisely so
          # it doesn't thrash these buildx entries; GitHub's own 7-day-unused
          # / 10GB LRU eviction manages them.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
