# Build the two deploy images (app + mbsync sidecar) in CI and push to GHCR,
# so the homelab VM can `docker compose pull` instead of building on-host
# (docs/deploy-docker.md "Prebuilt images"). linux/amd64 only — the deploy VM
# is x86 and the natives (vec0.so, PDFium/SkiaSharp) are fetched by TARGETARCH
# inside the build, so a CI build is equivalent to an on-host one.
#
# Two jobs, and only one of them builds:
#
#   build   — green CI on a push to main (or a manual run on main) builds the
#             tested commit and publishes sha-<short> + :latest. This is the
#             ONLY path that runs a Dockerfile.
#   promote — a v* tag push builds NOTHING. It finds the sha-<short> image the
#             build job already published for the tagged commit and adds the
#             v* tag to it. A release image is therefore byte-for-byte the build
#             that passed CI on main, and a v* tag can only exist for a commit
#             that went green on main — because nothing else ever produced a
#             sha- image. It refuses if the v* tag is already in GHCR, so a
#             re-run (or a re-pushed git tag) cannot re-point a release the
#             homelab has pinned.
#
# Before this split, a tag push rebuilt from scratch: nothing checked the
# commit had passed CI or was on main, a re-run silently moved an existing v*
# tag to a new digest, and the rebuild also re-pointed sha-<short> — while
# docs/deploy-docker.md promised the two were the same bytes.
#
# Deploys must pin v<version> (or its digest), never chase :latest — the app
# runs SchemaMigrator against the seeded archive on every start, so image
# updates are manual and backup-first (see the no-auto-update note in
# docs/deploy-docker.md). GHCR version pruning lives in cleanup.yml.

name: Publish images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    # For workflow_run events, publish only when CI passed on a PUSH to this
    # repository; manual runs only from main.
    #
    # The event + head_repository checks are the security boundary, not the
    # `branches: [main]` filter above: that filter matches the triggering
    # run's head BRANCH NAME, and CI also runs on pull_request — so a fork PR
    # from a branch named `main` passes it, and the checkout below would then
    # build the fork's commit (attacker-controlled Dockerfile) and push it to
    # GHCR with this repo's packages:write token.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: app
            image: ghcr.io/${{ github.repository_owner }}/mailvec
            target: runtime   # explicit: never depend on "last stage wins"
          - name: mbsync
            image: ghcr.io/${{ github.repository_owner }}/mailvec-mbsync
            target: mbsync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Under workflow_run, github.sha is the default-branch head at
          # trigger time, which may have advanced past the commit CI actually
          # tested — build exactly what passed.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          # The builder runs every build step and holds the GHCR push, so it is
          # pinned by digest like every other executable in the supply chain
          # (docs/security.md "Executable supply chain"). Left unset it defaults
          # to the moving tag moby/buildkit:buildx-stable-1. Bump deliberately.
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          echo "tags=${{ matrix.image }}:sha-${SHORT_SHA},${{ matrix.image }}:latest" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Publishing: ${{ matrix.image }}:sha-${SHORT_SHA} + :latest"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Build provenance (SLSA) + an SBOM, attached to the image as OCI
          # attestations. Two lines, so worth taking even though nothing
          # currently consumes them: what they buy is the ability to answer
          # "which commit produced the digest running in the homelab?" from the
          # registry rather than from memory, and to check a future advisory
          # against what's actually in a deployed image without rebuilding it.
          # Inspect with: docker buildx imagetools inspect <ref> --format '{{json .Provenance}}'
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.revision }}
          # Scoped per image so app/mbsync don't evict each other. NOTE:
          # cleanup.yml's cache prune is scoped to nuget-* keys precisely so
          # it doesn't thrash these buildx entries; GitHub's own 7-day-unused
          # / 10GB LRU eviction manages them.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  promote:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Long enough to wait out the build job: ops/release.sh --ship tags the
    # moment CI goes green, which is BEFORE the workflow_run build of that same
    # commit has pushed its sha- image.
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - image: ghcr.io/${{ github.repository_owner }}/mailvec
          - image: ghcr.io/${{ github.repository_owner }}/mailvec-mbsync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify release tag matches <Version>
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's|.*<Version>([0-9]+\.[0-9]+\.[0-9]+)</Version>.*|\1|p' Directory.Build.props)"
          if [[ "v${VERSION}" != "${GITHUB_REF_NAME}" ]]; then
            echo "ERROR: tag ${GITHUB_REF_NAME} does not match Directory.Build.props <Version>=${VERSION}." >&2
            echo "       Bump with ops/release.sh and tag the bump commit — the image label must" >&2
            echo "       equal what its binaries report from 'mailvec status'." >&2
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches <Version>=${VERSION}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GITHUB_REF_NAME is read from the environment, never through an Actions
      # expression: expressions are pasted into the script as text before bash
      # parses it, and git ref names permit " ; | and command substitution. The
      # tag gate above has already pinned it to v<Version>, but this job holds
      # packages:write and a live GHCR login, so the rule holds regardless.
      - name: Promote the green-main build of this commit
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          SOURCE="${IMAGE}:sha-$(git rev-parse --short=7 HEAD)"
          TARGET="${IMAGE}:${GITHUB_REF_NAME}"

          # Immutability: a published release is never re-pointed. Deleting the
          # GHCR version by hand is the (deliberate, visible) way to redo one.
          if docker buildx imagetools inspect "$TARGET" >/dev/null 2>&1; then
            echo "ERROR: $TARGET is already published. Release tags are immutable here —" >&2
            echo "       cut a new version rather than re-pointing one the homelab may pin." >&2
            exit 1
          fi

          # The build job publishes sha-<short> only for a commit that passed CI
          # on a push to main, so its existence IS the proof. Wait for it: the
          # tag usually lands while that build is still running.
          for attempt in $(seq 1 80); do
            if docker buildx imagetools inspect "$SOURCE" >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == 80 ]]; then
              echo "ERROR: no $SOURCE after 40 minutes. A v* tag can only be promoted from a commit" >&2
              echo "       that passed CI on main and was published by the build job. Is the tagged" >&2
              echo "       commit on main, and did its CI + 'Publish images' runs go green?" >&2
              exit 1
            fi
            echo "Waiting for $SOURCE (attempt $attempt/80)..."
            sleep 30
          done

          # Copies the source index (image + its provenance/SBOM attestations)
          # under the new name; the platform manifest — the bytes that run — is
          # the one CI built and tested.
          docker buildx imagetools create --tag "$TARGET" "$SOURCE"
          docker buildx imagetools inspect "$TARGET"
          echo "Promoted $SOURCE -> $TARGET"
