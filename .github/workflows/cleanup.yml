# Actions housekeeping. Three things accumulate on GitHub: workflow-run
# history (logs), Actions caches, and — since publish-images.yml — GHCR
# container versions (a sha-tagged pair per green main push). Keep the
# newest two of each, delete the rest weekly.
#
# The cache prune is scoped to nuget-* keys ON PURPOSE: publish-images.yml
# stores buildx layer caches as Actions caches too, and an unscoped
# keep-newest-2 would thrash one set or the other every Monday. Buildx
# entries are left to GitHub's own 7-day-unused / 10GB LRU eviction.
#
# Scope guard: this deletes completed workflow runs, nuget caches, and old
# per-commit GHCR builds only — it never touches releases, git tags, or git
# history. The image prune is ops/ghcr-prune.py, which keeps every v* and
# :latest image TOGETHER WITH the untagged manifests its index references.
# That distinction is the point: the first version here filtered on tags
# alone, and since an image's platform manifest and attestation carry no tag,
# it deleted them out from under every release older than a week. Don't
# replace the script with a tag filter. If a workflow ever
# starts uploading artifacts, prefer `retention-days` on the upload step
# over extending this job.

name: Cleanup

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the image prune plan and delete no images"
        type: boolean
        default: false

permissions:
  contents: read # checkout, for ops/ghcr-prune.py
  actions: write
  packages: write

concurrency:
  group: cleanup

jobs:
  prune:
    name: Prune old runs + caches (keep newest 2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      KEEP: 2
    steps:
      - name: Prune workflow runs
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/workflows" --jq '.workflows[].id' |
          while read -r wf; do
            # Runs come back newest-first; status=completed skips anything
            # in flight (including this run).
            gh api --paginate "repos/$REPO/actions/workflows/$wf/runs?status=completed&per_page=100" \
              --jq '.workflow_runs[].id' |
            tail -n +$((KEEP + 1)) |
            while read -r run; do
              echo "Deleting run $run (workflow $wf)"
              gh api -X DELETE "repos/$REPO/actions/runs/$run"
            done
          done

      - name: Prune caches (nuget-* only — buildx caches are GitHub-managed)
        run: |
          set -euo pipefail
          # Sort by last access so the cache CI is actively restoring is
          # always among the survivors. --key scopes to the NuGet caches;
          # see the header for why buildx entries are excluded.
          gh cache list --repo "$REPO" --limit 100 --key nuget- \
            --sort last_accessed_at --order desc \
            --json id --jq '.[].id' |
          tail -n +$((KEEP + 1)) |
          while read -r id; do
            echo "Deleting cache $id"
            gh cache delete "$id" --repo "$REPO"
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Fails the run if an image that was pullable before it is not pullable
      # after it. Images already broken by the old prune are warnings.
      - name: Prune GHCR per-commit builds (keeps every release image whole)
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          python3 -I ops/ghcr-prune.py --owner "${REPO%%/*}" --keep "$KEEP" $DRY_RUN mailvec mailvec-mbsync
